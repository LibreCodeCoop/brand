name: Build brand assets

on:
  push:
    paths:
      - "source/artwork/**"
      - ".github/workflows/assets.yml"
  pull_request:
    paths:
      - "source/artwork/**"
      - ".github/workflows/assets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
      - name: Generate approved derivatives
        run: |
          mkdir -p build
          for svg in source/artwork/*.svg; do
            name="$(basename "$svg" .svg)"
            rsvg-convert -w 1024 -f png -o "build/$name.png" "$svg"
            rsvg-convert -f pdf -o "build/$name.pdf" "$svg"
            cp "$svg" "build/$name.svg"
          done
      - uses: actions/upload-artifact@v6
        with:
          name: librecode-logo-derivatives
          path: build/
