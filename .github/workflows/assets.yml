name: Build brand assets

on:
  push:
    paths:
      - "source/artwork/**"
      - "scripts/build_assets.py"
      - ".github/workflows/assets.yml"
  pull_request:
    paths:
      - "source/artwork/**"
      - "scripts/build_assets.py"
      - ".github/workflows/assets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install asset toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y inkscape
      - name: Generate brand assets
        run: python scripts/build_assets.py --output build/assets
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: librecode-brand-assets
          path: build/assets/
