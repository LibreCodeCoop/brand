name: Build brand assets

on:
  push:
    paths:
      - "source/artwork/**"
      - "scripts/build_assets.py"
      - ".github/workflows/assets.yml"
  pull_request:
    paths:
      - "source/artwork/**"
      - "scripts/build_assets.py"
      - ".github/workflows/assets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install asset toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y inkscape
      - name: Generate brand assets
        run: python scripts/build_assets.py --output build/assets
      - uses: actions/upload-artifact@v6
        with:
          name: librecode-brand-assets
          path: build/assets/
