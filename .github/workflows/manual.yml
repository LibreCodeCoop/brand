name: Build brand manual

on:
  push:
    paths:
      - "manual/**"
      - "source/artwork/**"
      - "source/fonts/**"
      - "scripts/build_assets.py"
      - ".github/workflows/manual.yml"
  pull_request:
    paths:
      - "manual/**"
      - "source/artwork/**"
      - "source/fonts/**"
      - "scripts/build_assets.py"
      - ".github/workflows/manual.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: typst-community/setup-typst@fee4b65b091cc546f02ce3be15fad8760f38a108 # v5.3
        with:
          typst-version: 0.15.1
      - name: Check Typst formatting
        uses: typstyle-rs/typstyle-action@29e8697c27707b43f1dc08d3aba17868e14a1ce2 # v1.0.1
        with:
          # typstyle-action splits options on newlines, not spaces.
          opts: |
            --diff
            --line-width
            120
          inputs: manual
      - name: Install asset toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y inkscape
      - name: Generate brand assets
        run: python scripts/build_assets.py --output build/assets
      - name: Build accessible PDF
        run: |
          typst compile --root . --font-path source/fonts --pdf-standard ua-1 manual/main.typ build/brand-manual.pdf
          typst compile --root . --font-path source/fonts --pdf-standard ua-1 --input format=slides manual/main.typ build/brand-manual-slides.pdf
      - name: Validate PDF/UA-1 with veraPDF
        run: |
          docker run --rm \
            -v "$PWD/build:/data:ro" \
            verapdf/cli:latest \
            --flavour ua1 --format text /data/brand-manual.pdf
          docker run --rm \
            -v "$PWD/build:/data:ro" \
            verapdf/cli:latest \
            --flavour ua1 --format text /data/brand-manual-slides.pdf
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brand-manual
          path: |
            build/brand-manual.pdf
            build/brand-manual-slides.pdf
