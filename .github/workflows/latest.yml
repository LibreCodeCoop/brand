name: Publish latest brand build

on:
  push:
    branches: [main]
    paths:
      - "manual/**"
      - "source/artwork/**"
      - "source/fonts/**"
      - "scripts/build_assets.py"
      - ".github/workflows/latest.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-brand-build
  cancel-in-progress: true

jobs:
  latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: typst-community/setup-typst@40d32bb6ccb235bd7f5164cb47cfd40a5ea3a314 # v5.2.0
        with:
          typst-version: 0.15.1
      - name: Install asset toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y inkscape
      - name: Build latest artifacts
        run: |
          python scripts/build_assets.py --output build/assets
          typst compile --root . --font-path source/fonts --pdf-standard ua-1 manual/main.typ build/librecode-brand-manual.pdf
          cp build/assets/librecode-logo.svg build/librecode-logo.svg
          cp build/assets/librecode-logo.pdf build/librecode-logo.pdf
          cp build/assets/librecode-logo.png build/librecode-logo.png
          cp build/assets/librecode-logo-reversed.svg build/librecode-logo-reversed.svg
          sha256sum build/librecode-brand-manual.pdf build/librecode-logo* > build/SHA256SUMS
      - name: Validate PDF/UA-1 with veraPDF
        run: |
          docker run --rm \
            -v "$PWD/build:/data:ro" \
            verapdf/cli:latest \
            --flavour ua1 --format text /data/librecode-brand-manual.pdf
      - name: Move latest tag to this build
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force
      - name: Publish mutable homologation URLs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --prerelease --title "Latest homologation build" --notes "Continuously updated homologation build from the main branch. This is not a versioned release."
          fi
          gh release edit latest --title "Latest homologation build" --notes "Continuously updated homologation build from the main branch. This is not a versioned release." --prerelease
          gh release upload latest             build/librecode-brand-manual.pdf             build/librecode-logo.svg             build/librecode-logo.pdf             build/librecode-logo.png             build/librecode-logo-reversed.svg             build/SHA256SUMS             --clobber
