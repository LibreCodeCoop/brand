name: Publish brand release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1
      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
      - name: Build release artifacts
        run: |
          mkdir -p build
          typst compile --root . --font-path source/fonts --pdf-standard ua-1 manual/main.typ build/librecode-brand-manual.pdf
          for svg in source/artwork/*.svg; do
            name="$(basename "$svg" .svg)"
            rsvg-convert -w 1024 -f png -o "build/$name.png" "$svg"
            rsvg-convert -f pdf -o "build/$name.pdf" "$svg"
            cp "$svg" "build/$name.svg"
          done
          sha256sum build/* > build/SHA256SUMS
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --generate-notes --title "librecode brand $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" build/* --clobber
