name: Publish brand release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1
      - name: Install asset toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y inkscape
      - name: Build release artifacts
        run: |
          python scripts/build_assets.py --output build/assets
          typst compile --root . --font-path source/fonts --pdf-standard ua-1 manual/main.typ build/librecode-brand-manual.pdf
          cp build/assets/librecode-logo.svg build/librecode-logo.svg
          cp build/assets/librecode-logo.pdf build/librecode-logo.pdf
          cp build/assets/librecode-logo.png build/librecode-logo.png
          cp build/assets/librecode-logo-reversed.svg build/librecode-logo-reversed.svg
          sha256sum             build/librecode-brand-manual.pdf             build/librecode-logo.svg             build/librecode-logo.pdf             build/librecode-logo.png             build/librecode-logo-reversed.svg             > build/SHA256SUMS
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME"               --generate-notes               --title "librecode brand $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME"             build/librecode-brand-manual.pdf             build/librecode-logo.svg             build/librecode-logo.pdf             build/librecode-logo.png             build/librecode-logo-reversed.svg             build/SHA256SUMS             --clobber
